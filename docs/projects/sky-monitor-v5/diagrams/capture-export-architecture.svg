<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
  <defs>
    <style>
      .title { font: 24px sans-serif; font-weight: bold; fill: #ffffff; }
      .label { font: 16px sans-serif; fill: #ffffff; }
      .note { font: 14px sans-serif; fill: #cdd6f4; }
      .box { fill: #1e1e2e; stroke: #89b4fa; stroke-width: 2; rx: 12; ry: 12; }
      .store { fill: #1e1e2e; stroke: #f9e2af; stroke-width: 2; rx: 12; ry: 12; }
      .external { fill: #1e1e2e; stroke: #fab387; stroke-width: 2; rx: 12; ry: 12; }
      .arrow { stroke: #94e2d5; stroke-width: 3; marker-end: url(#arrowhead); fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94e2d5" />
    </marker>
  </defs>

  <rect width="1100" height="650" fill="#11111b" />
  <text class="title" x="550" y="50" text-anchor="middle">SkyMonitor V5 Capture-to-Export Architecture</text>

  <!-- Capture Service -->
  <rect class="box" x="60" y="110" width="240" height="120" />
  <text class="label" x="180" y="150" text-anchor="middle">AllSkyCaptureService</text>
  <text class="note" x="180" y="180" text-anchor="middle">Capture Loop &amp; Orchestration</text>

  <!-- Camera Adapter -->
  <rect class="box" x="360" y="110" width="240" height="120" />
  <text class="label" x="480" y="150" text-anchor="middle">CameraAdapterBase</text>
  <text class="note" x="480" y="180" text-anchor="middle">Exposure → Acquire → Process</text>

  <!-- Exposure Analyzer -->
  <rect class="box" x="360" y="270" width="240" height="100" />
  <text class="label" x="480" y="310" text-anchor="middle">ExposureAnalyzer</text>
  <text class="note" x="480" y="338" text-anchor="middle">Feedback Loop</text>

  <!-- Remote Publisher -->
  <rect class="box" x="660" y="110" width="220" height="120" />
  <text class="label" x="770" y="150" text-anchor="middle">RemoteFramePublisher</text>
  <text class="note" x="770" y="180" text-anchor="middle">WebSocket / HTTP / MQTT</text>

  <!-- Frame Export Publisher -->
  <rect class="box" x="660" y="270" width="220" height="100" />
  <text class="label" x="770" y="310" text-anchor="middle">FrameExportPublisher</text>
  <text class="note" x="770" y="338" text-anchor="middle">Raw &amp; Processed Envelopes</text>

  <!-- Background Stacker -->
  <rect class="box" x="360" y="430" width="240" height="110" />
  <text class="label" x="480" y="470" text-anchor="middle">BackgroundFrameStacker</text>
  <text class="note" x="480" y="500" text-anchor="middle">Async Queue &amp; Worker</text>

  <!-- Filter Pipeline -->
  <rect class="box" x="660" y="430" width="220" height="110" />
  <text class="label" x="770" y="470" text-anchor="middle">FrameFilterPipeline</text>
  <text class="note" x="770" y="500" text-anchor="middle">Stack → Filter → Project</text>

  <!-- Export Sinks -->
  <rect class="external" x="920" y="260" width="160" height="120" />
  <text class="label" x="1000" y="300" text-anchor="middle">Export Sinks</text>
  <text class="note" x="1000" y="328" text-anchor="middle">S3 · Filesystem · Future</text>

  <!-- Telemetry Store -->
  <rect class="store" x="920" y="440" width="160" height="100" />
  <text class="label" x="1000" y="478" text-anchor="middle">Telemetry Store</text>
  <text class="note" x="1000" y="506" text-anchor="middle">Metrics &amp; Diagnostics</text>

  <!-- External Camera SDK -->
  <rect class="external" x="360" y="20" width="240" height="70" />
  <text class="label" x="480" y="55" text-anchor="middle">Camera SDK / Hardware</text>

  <!-- Arrows -->
  <line class="arrow" x1="300" y1="170" x2="360" y2="170" />
  <line class="arrow" x1="600" y1="170" x2="660" y2="170" />
  <line class="arrow" x1="600" y1="320" x2="660" y2="320" />
  <line class="arrow" x1="880" y1="300" x2="920" y2="300" />
  <line class="arrow" x1="880" y1="485" x2="920" y2="485" />
  <line class="arrow" x1="480" y1="230" x2="480" y2="270" />
  <line class="arrow" x1="480" y1="370" x2="480" y2="430" />
  <line class="arrow" x1="600" y1="485" x2="660" y2="485" />
  <line class="arrow" x1="770" y1="380" x2="770" y2="430" />
  <line class="arrow" x1="770" y1="540" x2="1000" y2="540" />
  <line class="arrow" x1="480" y1="90" x2="480" y2="110" />
  <line class="arrow" x1="300" y1="470" x2="360" y2="470" />
  <line class="arrow" x1="300" y1="330" x2="360" y2="330" />

  <!-- Legend -->
  <rect class="box" x="60" y="500" width="240" height="110" />
  <text class="label" x="90" y="530">Legend</text>
  <text class="note" x="90" y="555">Blue outline: Core pipeline</text>
  <text class="note" x="90" y="575">Orange outline: External integration</text>
  <text class="note" x="90" y="595">Gold outline: Data store / telemetry</text>
</svg>
