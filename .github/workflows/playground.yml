name: Playground CI

on:
  push:
    branches: [ main ]
    paths:
      - 'src/HVO.Playground/**'
      - 'src/NuGet.config'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
  pull_request:
    branches: [ main, feature/** ]
    paths:
      - 'src/HVO.Playground/**'
      - 'src/NuGet.config'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/HVO.Playground/HVO.Playground.sln --configfile src/NuGet.config --nologo -v minimal
      - name: Build (Debug)
        run: dotnet build src/HVO.Playground/HVO.Playground.sln --no-restore -c Debug --nologo -v minimal /p:ContinuousIntegrationBuild=true
      - name: Test (Unit, Debug)
        run: dotnet test src/HVO.Playground/HVO.Playground.sln --no-build -c Debug --nologo -v minimal --filter "TestCategory!=Integration" --logger "trx;LogFileName=tests.trx" --collect:"XPlat Code Coverage" -- ResultsDirectory src/TestResults/Playground
      - name: Test (Integration, Debug - gated)
        if: |
          github.ref == 'refs/heads/main' || 
          github.event_name == 'schedule' || 
          (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'integration-tests'))
        run: dotnet test src/HVO.Playground/HVO.Playground.sln --no-build -c Debug --nologo -v minimal --filter "TestCategory=Integration" --logger "trx;LogFileName=tests-integration.trx" --collect:"XPlat Code Coverage" -- ResultsDirectory src/TestResults/Playground
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playground-test-results-${{ github.run_id }}
          path: |
            src/TestResults/Playground/**
            **/TestResults/**
          retention-days: 7
