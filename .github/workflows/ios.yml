name: iOS (iPad) CI

on:
  push:
    branches: [ main ]
    paths:
      - 'src/HVO.iOS/**'
      - 'src/HVO.RoofControllerV4/HVO.RoofControllerV4.iPad/**'
      - 'src/HVO/**'
      - 'src/NuGet.config'
      - 'src/global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
  pull_request:
    branches: [ main, feature/** ]
    paths:
      - 'src/HVO.iOS/**'
      - 'src/HVO.RoofControllerV4/HVO.RoofControllerV4.iPad/**'
      - 'src/HVO/**'
      - 'src/NuGet.config'
      - 'src/global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json
      - name: Install .NET MAUI workload (for iOS toolchain)
        run: dotnet workload install maui --ignore-failed-sources
      - name: Restore
        run: dotnet restore src/HVO.iOS/HVO.iOS.sln --configfile src/NuGet.config --nologo -v minimal
      - name: Build iOS (Simulator, no codesign) - Debug
        run: >
          dotnet build src/HVO.iOS/HVO.RoofControllerV4.iPad/HVO.RoofControllerV4.iPad.csproj
          -c Debug --no-restore --nologo -v minimal
          -p:ContinuousIntegrationBuild=true
          -p:RuntimeIdentifier=iossimulator-arm64
          -p:Codesign=false
      - name: Upload iOS build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-artifacts-${{ github.run_id }}
          path: |
            src/HVO.iOS/**/bin/Debug/**
          if-no-files-found: warn
          retention-days: 3
