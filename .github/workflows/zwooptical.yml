name: ZWO Optical Domain CI

on:
  push:
    branches: [ main ]
    paths:
      - 'src/HVO.ZWOOptical/**'
      - 'src/HVO/**'
      - 'src/NuGet.config'
      - 'src/global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
  pull_request:
    branches: [ main, feature/** ]
    paths:
      - 'src/HVO.ZWOOptical/**'
      - 'src/HVO/**'
      - 'src/NuGet.config'
      - 'src/global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json
      - name: Restore
        run: dotnet restore src/HVO.ZWOOptical/HVO.ZWOOptical.sln --configfile src/NuGet.config --nologo -v minimal
      - name: Build (Debug)
        run: dotnet build src/HVO.ZWOOptical/HVO.ZWOOptical.sln --no-restore -c Debug --nologo -v minimal /p:ContinuousIntegrationBuild=true
      - name: Pack ASISDK (Debug)
        run: dotnet pack src/HVO.ZWOOptical/HVO.ZWOOptical.ASISDK/HVO.ZWOOptical.ASISDK.csproj -c Debug --no-build --nologo -o ./.out
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: zwo-packages-${{ github.run_id }}
          path: |
            ./.out/*.nupkg
          retention-days: 7
