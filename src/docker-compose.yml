# Root orchestration that composes domain-level stacks.
# Requires Docker Compose with 'include' support. Alternatively, use multiple -f files.

include:
  - path: ./HVO.RoofControllerV4/docker-compose.yml
  - path: ./HVO.SkyMonitorV5/docker-compose.yml
  - path: ./HVO.WebSite/docker-compose.yml

networks:
  hvo-network:
    name: hvo-network
    driver: bridge
